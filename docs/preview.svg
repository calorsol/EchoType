<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="'Noto Serif SC','Segoe UI',serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EFE8"/>
      <stop offset="1" stop-color="#E9E3D9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#36322D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- top bar -->
  <g>
    <rect x="60" y="34" width="34" height="34" rx="10" fill="#909E7E"/>
    <path d="M70 56c0-7 5-11 16-12 0 8-5 12-13 12a4 4 0 0 1-3 0z" fill="#FAF8F4" opacity="0.9"/>
    <text x="106" y="52" font-size="20" fill="#36322D" font-weight="600">EchoType</text>
    <text x="106" y="66" font-size="10" fill="#7A736B" letter-spacing="3">听得见的写作</text>

    <!-- top icons -->
    <g fill="none" stroke="#5F5851" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(770,42)"><path d="M0 4v6h4l5 4V0L4 4H0z" fill="#5F5851" stroke="none"/><path d="M12 4a3.5 3.5 0 0 1 0 6"/></g>
      <g transform="translate(818,42)"><path d="M0 16V8M6 16V2M12 16V9M18 16H-1"/></g>
      <g transform="translate(866,42)"><path d="M9 1v9M6 4l3-3 3 3M2 11v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></g>
    </g>
  </g>

  <!-- writing area -->
  <g font-size="20" fill="#36322D" letter-spacing="1">
    <text x="120" y="170">晨光漫过窗台的时候，我习惯先写下一行字。</text>
    <text x="120" y="214">键盘的回响像雨，像远处的篝火，</text>
    <text x="120" y="258">把杂念一点点抚平。</text>
    <text x="120" y="302" fill="#A9B49A">这是属于写作者的安静角落。<tspan fill="#76876A">▍</tspan></text>
  </g>

  <!-- floating sound panel -->
  <g filter="url(#shadow)">
    <rect x="648" y="92" width="252" height="232" rx="16" fill="#FAF8F4" stroke="#DBD3C5"/>
    <text x="672" y="122" font-size="14" fill="#4A443E">声音 · Ambience</text>
    <g font-size="11">
      <rect x="672" y="138" width="92" height="26" rx="8" fill="#E9E3D9"/><text x="690" y="155" fill="#5F5851">机械青轴</text>
      <rect x="772" y="138" width="104" height="26" rx="8" fill="#909E7E"/><text x="792" y="155" fill="#FAF8F4">客制化</text>
    </g>
    <!-- ambient rows -->
    <g>
      <circle cx="688" cy="196" r="15" fill="#C9ADA7"/><text x="714" y="200" font-size="11" fill="#5F5851">雨声</text>
      <rect x="760" y="194" width="116" height="4" rx="2" fill="#DBD3C5"/><circle cx="822" cy="196" r="6" fill="#76876A"/>
      <circle cx="688" cy="232" r="15" fill="#E9E3D9"/><text x="714" y="236" font-size="11" fill="#5F5851">白噪音</text>
      <rect x="760" y="230" width="116" height="4" rx="2" fill="#DBD3C5"/><circle cx="806" cy="232" r="6" fill="#76876A"/>
      <circle cx="688" cy="268" r="15" fill="#C9ADA7"/><text x="714" y="272" font-size="11" fill="#5F5851">篝火</text>
      <rect x="760" y="266" width="116" height="4" rx="2" fill="#DBD3C5"/><circle cx="836" cy="268" r="6" fill="#76876A"/>
    </g>
    <text x="672" y="308" font-size="9" fill="#7A736B">所有声音由浏览器实时合成，无需联网。</text>
  </g>

  <!-- bottom status bar -->
  <g>
    <text x="120" y="494" font-size="16" fill="#5F5851">51</text>
    <text x="146" y="494" font-size="12" fill="#7A736B">字 · 59 字符</text>
    <g transform="translate(740,482)" fill="#A47F76">
      <path d="M9 0c1.5 2.2 3 3.3 3 6a3 3 0 0 1-6 0c0-.9.3-1.5.8-2.1C6.4 4.9 6.7 2.5 9 0z" stroke="none"/>
    </g>
    <text x="758" y="494" font-size="12" fill="#A47F76">连续 1 天</text>
    <text x="838" y="494" font-size="12" fill="#7A736B">今日 +51</text>
  </g>
</svg>
